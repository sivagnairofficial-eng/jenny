<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Present for Jennifer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page page-index">
    <main class="card">
      <p class="eyebrow">A small surprise from Siva</p>
      <h1>A present is waiting</h1>
      <p class="subtext">
        Tap the gift to open the birthday journey for Jennifer.
      </p>

      <button class="gift-button" type="button" data-gift aria-label="Open the present">
        <span class="gift-emoji" aria-hidden="true">🎁</span>
        <span class="gift-label">Click to open the present</span>
      </button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
